<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="updater-base-path" content="__UPDATER_BASE_PATH__"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ジョブ検索 · FLAMORIS Updater</title><link rel="stylesheet" href="__UPDATER_BASE_PATH__/static/style.css"><script src="__UPDATER_BASE_PATH__/static/managed.js" defer></script></head>
<body><header><a class="brand" href="__UPDATER_BASE_PATH__/">FLAMORIS <strong>Updater</strong></a><div id="identity"><strong id="hostname">接続先を確認中</strong><span id="version"></span><span id="connection" role="status" aria-live="polite">接続中</span></div><label class="theme-picker">このサーバーの配色<select id="theme"><option value="green">グリーン</option><option value="blue">ブルー</option><option value="purple">パープル</option><option value="amber">アンバー</option></select></label></header><main><div class="heading"><h1>ジョブ検索</h1><a class="link-button" href="__UPDATER_BASE_PATH__/">アプリの管理へ</a></div>
<section class="card"><form id="history-search"><label>アプリ<select id="history-app"><option value="">全アプリ</option><option value="__unassigned__">アプリ未指定</option></select></label><label>作成日時・開始<input id="history-from" type="datetime-local" step="1"></label><label>作成日時・終了<input id="history-to" type="datetime-local" step="1"></label><button type="submit">検索</button></form><p id="timezone" class="hint"></p><p id="search-status" role="status" aria-live="polite"></p><div id="history"></div><div id="history-pages" class="pagination"></div></section>
<section id="job-detail" class="card" hidden><h2>ジョブの詳細・経過</h2><div id="job-summary"></div><div id="job-events"></div><button id="more-events" type="button" hidden>経過をさらに表示</button></section>
<div id="notice" role="status" aria-live="polite" hidden></div><div id="message" role="alert" hidden><span id="error-text"></span><button id="dismiss-error" type="button" class="quiet">閉じる</button></div></main></body></html>
