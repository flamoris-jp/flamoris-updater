<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FLAMORIS Updater</title><link rel="stylesheet" href="/static/style.css"><script src="/static/managed.js" defer></script></head>
<body><header><a class="brand" href="/">FLAMORIS <strong>Updater</strong></a><span id="identity"></span><button id="logout" hidden>ログアウト</button></header><main>
<section id="setup" class="card" hidden><h1>Updaterをセットアップ</h1><p id="root"></p><form id="setup-form"><label>セットアップコード<input name="setup_token" type="password" required autocomplete="off"></label><label>管理者名<input name="username" required autocomplete="username" pattern="[a-z0-9][a-z0-9._-]*"></label><label>管理者パスワード<input name="password" type="password" required minlength="12" autocomplete="new-password"></label><label>リリースカタログURL<input name="catalog_url" type="url" required placeholder="https://…/catalog.json"></label><button>セットアップ</button></form></section>
<section id="login" class="card" hidden><h1>ログイン</h1><form id="login-form"><label>管理者名<input name="username" required autocomplete="username"></label><label>パスワード<input name="password" type="password" required autocomplete="current-password"></label><button>ログイン</button></form></section>
<section id="workspace" hidden><h1>アプリのインストール・更新</h1><p>必要なアプリを選んで導入できます。更新時は設定とデータを引き継ぎ、動作確認後に旧版を1世代だけ残します。</p><button id="refresh">再読み込み</button><button id="token" class="quiet">CLI・MCP用トークンを発行</button><pre id="access-token" hidden></pre><div id="applications" class="grid"></div><h2>実行状況・履歴</h2><div id="history"></div></section>
<div id="message" role="alert" hidden></div></main></body></html>
