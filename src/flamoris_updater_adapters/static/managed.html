<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="updater-base-path" content="__UPDATER_BASE_PATH__"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FLAMORIS Updater</title><link rel="stylesheet" href="__UPDATER_BASE_PATH__/static/style.css"><script src="__UPDATER_BASE_PATH__/static/managed.js" defer></script></head>
<body><header><a class="brand" href="__UPDATER_BASE_PATH__/">FLAMORIS <strong>Updater</strong></a></header><main>
<section class="card"><h1>リポジトリのカタログ</h1><p>各リポジトリのカタログを登録します。配布物はそれぞれの配布元から取得します。</p><form id="catalog-form"><label>カタログURL<input name="url" type="url" required placeholder="https://…/catalog.json"></label><button>登録</button></form><div id="catalogs"></div></section>
<section id="workspace"><h1>アプリのインストール・更新</h1><p>必要なアプリを選んで導入できます。更新時は設定とデータを引き継ぎ、動作確認後に旧版を1世代だけ残します。</p><p id="root"></p><button id="refresh">再読み込み</button><div id="applications" class="grid"></div><h2>実行状況・履歴</h2><div id="history"></div></section>
<section id="self-section" class="card" hidden><h2>Updater本体の更新</h2><p>更新中は管理画面とMCP接続が一時停止します。</p><div id="self-update"></div></section>
<div id="message" role="alert" hidden></div></main></body></html>
