name: CI
on:
  push:
    branches: [main, feat/updater-v1]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  initial-docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --constraint requirements-runtime.lock -e '.[dev]'
      - run: python scripts/build_initial_candidate.py --application flamoris-generation-mcp --platform linux/amd64 --output dist/candidate
      - run: sudo env FLAMORIS_INSTALL_TEST_DOCKER_CANDIDATE="$PWD/dist/candidate" "$(command -v python)" -m pytest -q tests/test_install.py -k real_docker
  initial-install:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_PASSWORD: disposable-test-password
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --constraint requirements-runtime.lock -e '.[dev]'
      - run: sudo env FLAMORIS_INSTALL_TEST_POSTGRES_DSN='postgresql://postgres:disposable-test-password@127.0.0.1:5432/postgres' "$(command -v python)" -m pytest -q tests/test_install.py tests/test_managed.py tests/test_self_update.py tests/test_install_distribution.py
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --constraint requirements-runtime.lock -e '.[dev]'
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - run: pytest -q
      - name: Verify real GitHub Release download with bounded redirects
        run: |
          python - <<'PY'
          import httpx
          from flamoris_update_core.wire import digest
          from flamoris_updater_adapters.artifacts import Fetcher
          with httpx.Client(verify=True, trust_env=False, timeout=30) as client:
              raw = Fetcher(["https://github.com"], client, public_redirects=True).bytes(
                  "https://github.com/flamoris-jp/flamoris-updater/releases/download/v1.0.1/SHA256SUMS", 65536
              )
          assert digest(raw) == "sha256:c90ff0ecf4367872bc5654c22e7a7ffa79223c929634ae2d8c0fe305229a70ea"
          print("Public GitHub Release download and SHA-256 verified")
          PY
      - run: python -m build
      - run: python -m build packages/update-core --outdir dist/sdk
      - run: python scripts/export_schemas.py --output dist/schemas
      - run: python scripts/check_docs.py
      - uses: actions/upload-artifact@v4
        with:
          name: source-wheel-and-schemas
          path: dist/
  native-bundle:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build --wheel
      - run: |
          python -m pip download --only-binary=:all: --constraint requirements-runtime.lock --dest dist/wheels dist/*.whl
      - run: python scripts/build_bundle.py --wheelhouse dist/wheels --output dist/native --platform '${{ matrix.platform }}' --version 1.0.1 --python-executable /usr/bin/python3.12
      - run: python -m pip install dist/*.whl
      - run: python scripts/verify_bundle.py --directory dist/native
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.runner }}
          path: dist/native/
