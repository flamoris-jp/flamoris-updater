name: CI
on:
  push:
    branches: [main, feat/updater-v1]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  isolated-restore:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y postgresql-14 bubblewrap
      - run: python -m pip install '.[dev]' 'psycopg[binary]>=3.2,<4'
      - run: pytest -q tests/test_postgres_restore.py
        env:
          FLAMORIS_TEST_POSTGRES_BIN: /usr/lib/postgresql/14/bin
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --constraint requirements-runtime.lock -e '.[dev]'
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - run: pytest -q
      - run: python -m build
      - run: python -m build packages/update-core --outdir dist/sdk
      - run: python scripts/export_schemas.py --output dist/schemas
      - run: python scripts/check_docs.py
      - uses: actions/upload-artifact@v4
        with:
          name: source-wheel-and-schemas
          path: dist/
  native-bundle:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build --wheel
      - run: |
          python -m pip download --only-binary=:all: --constraint requirements-runtime.lock --dest dist/wheels dist/*.whl
      - run: python scripts/build_bundle.py --wheelhouse dist/wheels --output dist/native --platform '${{ matrix.platform }}' --version 1.0.0 --python-executable /usr/bin/python3.12
      - run: python -m pip install dist/*.whl
      - run: python scripts/verify_bundle.py --directory dist/native
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.runner }}
          path: dist/native/
