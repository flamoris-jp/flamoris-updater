name: Prepare signed release candidate
on:
  workflow_dispatch:
    inputs:
      release_origin:
        description: Approved direct HTTPS distribution origin
        required: true
      release_key_id:
        description: Provisioned release-purpose key ID
        required: true
permissions:
  contents: read
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify immutable release tag
        run: test "$(git rev-parse 'v1.0.0^{commit}')" = "$GITHUB_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build --wheel
      - run: |
          python -m pip download --only-binary=:all: --constraint requirements-runtime.lock --dest dist/wheels dist/*.whl
          python scripts/build_bundle.py --wheelhouse dist/wheels --output dist/native --platform '${{ matrix.platform }}' --version 1.0.0 --python-executable /usr/bin/python3.12
          python -m pip install --constraint requirements-runtime.lock dist/*.whl
          python scripts/verify_bundle.py --directory dist/native
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.runner }}
          path: dist/native/
  sign:
    needs: build
    runs-on: ubuntu-24.04
    environment: release-signing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: candidate/bundles
      - run: python -m pip install --constraint requirements-runtime.lock .
      - name: Prepare validated manifest and notes
        env:
          RELEASE_ORIGIN: ${{ inputs.release_origin }}
        run: python scripts/prepare_release.py --bundles candidate/bundles --output candidate/metadata --version 1.0.0 --revision "$GITHUB_SHA" --release-origin "$RELEASE_ORIGIN"
      - name: Sign exact bytes in the release environment
        env:
          RELEASE_PRIVATE_KEY_BASE64: ${{ secrets.UPDATER_RELEASE_PRIVATE_KEY_BASE64 }}
          RELEASE_KEY_ID: ${{ inputs.release_key_id }}
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          from flamoris_updater_adapters.signing import Signer
          from flamoris_update_core.wire import dumps
          from flamoris_updater_adapters.releases import validate_notes
          from flamoris_update_core.models import Manifest
          from flamoris_update_core.wire import decode
          raw=Path('candidate/metadata/release.json').read_bytes()
          validate_notes(decode(Manifest,raw),Path('candidate/metadata/release-notes.md').read_bytes(),Path('candidate/metadata/changes.json').read_bytes())
          secret=base64.b64decode(os.environ['RELEASE_PRIVATE_KEY_BASE64'],validate=True)
          if len(secret)!=32:raise SystemExit('Release signing secret is not provisioned correctly')
          Path('candidate/metadata/release.sig.json').write_bytes(dumps(Signer(os.environ['RELEASE_KEY_ID'],secret).envelope(raw)))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: signed-release-candidate
          path: candidate/
