name: Build pinned Python 3.12 runtime
on:
  pull_request:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 797d6f4e7bd4089e7c162fa50c10a0afae68370a
      - name: Verify exact reviewed Updater source
        run: test "$(git rev-parse HEAD)" = "797d6f4e7bd4089e7c162fa50c10a0afae68370a"
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential ca-certificates curl xz-utils libssl-dev zlib1g-dev libbz2-dev libreadline-dev libsqlite3-dev libffi-dev liblzma-dev uuid-dev
      - name: Build fixed CPython runtime
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --proto '=https' --tlsv1.2 --output Python-3.12.15.tar.xz https://www.python.org/ftp/python/3.12.15/Python-3.12.15.tar.xz
          printf '%s  %s\n' 'c2c4321961fab0fb999d66e0cecf521c2ab3994c7992873ea99e306c1094fd5a' 'Python-3.12.15.tar.xz' | sha256sum --check
          tar --extract --file Python-3.12.15.tar.xz
          cd Python-3.12.15
          ./configure --prefix=/opt/flamoris-python/3.12.15 --with-ensurepip=install
          make -j2
          make DESTDIR="$GITHUB_WORKSPACE/runtime-root" altinstall
          cd "$GITHUB_WORKSPACE"
          runtime-root/opt/flamoris-python/3.12.15/bin/python3.12 -I -c 'import hashlib,ssl,sqlite3,venv; print(ssl.OPENSSL_VERSION)'
          mkdir -p runtime-root/opt/flamoris-python/3.12.15
          {
            printf 'format_version=1\n'
            printf 'python_version=3.12.15\n'
            printf 'python_source_sha256=c2c4321961fab0fb999d66e0cecf521c2ab3994c7992873ea99e306c1094fd5a\n'
            printf 'updater_source_revision=797d6f4e7bd4089e7c162fa50c10a0afae68370a\n'
            printf 'runner_image=ubuntu-24.04\n'
            dpkg-query -W -f='${Package}=${Version}\n' build-essential libc6-dev libssl-dev zlib1g-dev libbz2-dev libreadline-dev libsqlite3-dev libffi-dev liblzma-dev uuid-dev | LC_ALL=C sort
          } > runtime-root/opt/flamoris-python/3.12.15/BUILD-PROVENANCE.txt
          find runtime-root -type d -exec chmod 0555 {} +
          find runtime-root -type f -exec chmod 0444 {} +
          find runtime-root -type f -path '*/bin/*' -exec chmod 0555 {} +
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -C runtime-root -czf flamoris-python-3.12.15-linux-amd64.tar.gz .
          sha256sum flamoris-python-3.12.15-linux-amd64.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: flamoris-python-3.12.15-linux-amd64
          path: |
            flamoris-python-3.12.15-linux-amd64.tar.gz
            SHA256SUMS
          retention-days: 3
