name: Publish Updater v1.0.0
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v1.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: updater-release-v1.0.0
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build --wheel
      - name: Build and verify indexed installation bundle
        run: |
          python -m pip download --only-binary=:all: --constraint requirements-runtime.lock --dest dist/wheels dist/*.whl
          python scripts/build_bundle.py --wheelhouse dist/wheels --output dist/native --platform '${{ matrix.platform }}' --version 1.0.0 --python-executable /usr/bin/python3.12
          python -m pip install --constraint requirements-runtime.lock dist/*.whl
          python scripts/verify_bundle.py --directory dist/native
      - name: Collect versioned bundle metadata
        run: mv dist/native/bundle-digests.json dist/native/bundle-digests-linux-${{ matrix.arch }}.json
      - name: Build source, SDK and schemas
        if: matrix.arch == 'amd64'
        run: |
          python -m build --sdist
          python -m build packages/update-core --outdir dist/sdk
          python scripts/export_schemas.py --output dist/schemas
          cp dist/*.whl dist/*.tar.gz dist/native/
          cp dist/sdk/* dist/native/
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          with ZipFile('dist/native/flamoris-updater-1.0.0-schemas.zip','w',compression=ZIP_DEFLATED) as archive:
              for p in sorted(Path('dist/schemas').glob('*.json')):
                  archive.write(p,p.name)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: distribution-${{ matrix.arch }}
          path: dist/native/
  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: distribution-*
          path: candidate/
      - run: python -m pip install --constraint requirements-runtime.lock .
      - name: Assemble exact-byte distribution metadata and checksums
        run: python scripts/package_distribution.py --inputs candidate --output distribution --version 1.0.0 --revision "$GITHUB_SHA"
      - name: Publish complete immutable-version release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen
          url = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/git/ref/tags/v1.0.0'
          request = Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
          try:
              with urlopen(request, timeout=30) as response:
                  response.read(65536)
          except HTTPError as error:
              if error.code != 404:
                  raise SystemExit('Cannot verify release tag: HTTP ' + str(error.code))
          else:
              raise SystemExit('v1.0.0 already exists; refusing to reuse or replace the tag')
          PY
          gh release create v1.0.0 distribution/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'FLAMORIS Updater v1.0.0' --notes-file release-notes/1.0.0.md --latest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: updater-v1.0.0-distribution
          path: distribution/
