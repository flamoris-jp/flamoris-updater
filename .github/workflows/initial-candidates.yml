name: Initial installation candidates
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'HTTPS directory for immutable assets (GitHub Releases require the corrected Updater)'
        type: string
        required: true
permissions:
  contents: read
jobs:
  candidate:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        application: [flamoris-ai-agent, flamoris-studio, flamoris-intelligence-mcp, flamoris-generation-mcp, flamoris-mcp-hub, flamoris-gpu-node-manager]
        platform:
          - {runner: ubuntu-24.04, name: linux/amd64}
          - {runner: ubuntu-24.04-arm, name: linux/arm64}
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --constraint requirements-runtime.lock -e .
      - run: python scripts/build_initial_candidate.py --application '${{ matrix.application }}' --platform '${{ matrix.platform.name }}' --output dist/candidate
      - uses: actions/upload-artifact@v4
        with:
          name: initial-${{ matrix.application }}-${{ matrix.platform.runner }}
          path: dist/candidate/
          if-no-files-found: error
  distribution:
    needs: candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --constraint requirements-runtime.lock -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: initial-*
          path: dist/candidates
      - name: Validate candidates and assemble catalog with unique asset names
        env:
          CATALOG_BASE_URL: ${{ inputs.base_url }}
        run: python scripts/package_install_catalog.py --candidates dist/candidates --base-url "$CATALOG_BASE_URL" --output dist/distribution
      - uses: actions/upload-artifact@v4
        with:
          name: initial-install-distribution
          path: dist/distribution/
          if-no-files-found: error
