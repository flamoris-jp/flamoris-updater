[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "flamoris-updater"
version = "1.0.0"
description = "Durable, authorized application updates with a reusable Core"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["pydantic>=2.12,<3", "cryptography>=46,<49", "httpx>=0.28,<1", "mcp>=1.26,<2", "starlette>=0.49,<2", "uvicorn>=0.40,<1", "argon2-cffi>=25,<26", "psycopg[binary]>=3.2,<4"]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "httpx2>=2,<3", "pytest-asyncio>=1,<2", "ruff>=0.14,<1", "build>=1.3,<2"]

[project.scripts]
flamoris-updater = "flamoris_updater_adapters.cli:main"
flamoris-updater-host = "flamoris_updater_adapters.host_api:main"
flamoris-updater-helper = "flamoris_updater_adapters.helper:main"
flamoris-updater-recovery = "flamoris_updater_adapters.recovery_cli:main"
flamoris-update-migration = "flamoris_update_migration.runner:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
flamoris_updater_adapters = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
